name: Release
on:
  push:
    branches:
      - master # or main

permissions:
  contents: write # for checkout

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    strategy:
      matrix:
        node-version: [24] # Node 20 is deprecated on GitHub runners
    steps:
      - uses: actions/checkout@v5 # Checkout the repository
      - name: Install pnpm
        # No version here on purpose: the action reads packageManager from
        # package.json, so CI and local development stay on the same pnpm.
        uses: pnpm/action-setup@v5 # Use pnpm's official GitHub Action
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm" # Enable pnpm cache
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Nothing gated a release on the suite before this. The exerciser suite
      # in src/tests/exerciser compiles the emulator core with the host
      # compiler, which ubuntu-latest provides; 8080EXM stays opt-in behind
      # RUN_8080EXM and is not run here.
      - name: Test
        run: pnpm test
      # - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
      #   run: pnpm audit
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: pnpm semantic-release
